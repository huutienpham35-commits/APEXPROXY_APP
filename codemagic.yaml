workflows:
  ios-ipa:
    name: Build IPA
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
      vars:
        XCODE_PROJECT: "ThreeOneOSFive.xcodeproj"
        XCODE_SCHEME: "3105"
    scripts:
      - name: Build Archive
        script: |
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath build/3105.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -destination 'generic/platform=iOS'

      - name: Create IPA
        script: |
          mkdir -p build/ios/ipa
          cd build/3105.xcarchive/Products/Applications
          zip -r ../../../../ios/ipa/3105.ipa *.app
    artifacts:
      - build/ios/ipa/*.ipa
      - build/**/*.xcarchive
echo "=== CHECK BODYPROXY ==="

echo "CM_BUILD_DIR=$CM_BUILD_DIR"
pwd

ls -la "$CM_BUILD_DIR"
ls -la "$CM_BUILD_DIR/ThreeOneOSFive" || true
ls -la "$CM_BUILD_DIR/ThreeOneOSFive/BodyProxy" || true

echo "=== CACHE_RES FILES ==="
find "$CM_BUILD_DIR" -type f -name "*.cache_res" -print || true

echo "=== GIT TRACKED ==="
cd "$CM_BUILD_DIR"
git ls-files | grep -i "cache_res" || true

echo "=== GIT STATUS ==="
git status --short
