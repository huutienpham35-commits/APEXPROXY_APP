workflows:
  list-schemes:
    name: List Schemes
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: List available schemes
        script: |
          echo "===== Listing schemes ====="
          xcodebuild -list -project ThreeOneOSFive.xcodeproj
          echo "===== Done ====="
